name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: Build even if version did not change
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail

          extract_version() {
            local file="$1"
            local name code
            name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$file" | head -1)"
            code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "$file" | head -1)"
            if [ -z "$name" ] || [ -z "$code" ]; then
              echo "::error::Could not read versionName/versionCode from $file"
              exit 1
            fi
            printf '%s %s' "$name" "$code"
          }

          CURRENT="$(extract_version app/build.gradle.kts)"
          CURRENT_NAME="${CURRENT%% *}"
          CURRENT_CODE="${CURRENT##* }"
          TAG="v${CURRENT_NAME}"

          {
            echo "version_name=${CURRENT_NAME}"
            echo "version_code=${CURRENT_CODE}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          CHANGED=true
          if [ "${EVENT_NAME}" = "push" ] \
            && [ -n "${BEFORE}" ] \
            && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}:app/build.gradle.kts" 2>/dev/null; then
            PREV_FILE="$(mktemp)"
            git show "${BEFORE}:app/build.gradle.kts" > "${PREV_FILE}"
            PREVIOUS="$(extract_version "${PREV_FILE}")"
            rm -f "${PREV_FILE}"
            echo "Previous version: ${PREVIOUS}"
            if [ "${PREVIOUS}" = "${CURRENT}" ]; then
              CHANGED=false
            fi
          fi

          echo "Current version: ${CURRENT_NAME} (${CURRENT_CODE})"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

          if [ "${CHANGED}" != "true" ] && [ "${FORCE}" != "true" ]; then
            echo "Version unchanged on main; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          if [ "${STATUS}" = "200" ] && [ "${FORCE}" != "true" ]; then
            echo "Release ${TAG} already exists; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.version.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.version.outputs.should_build == 'true'
        uses: android-actions/setup-android@v4
        with:
          # Avoid the deprecated `tools` package (removed by Google; breaks sdkmanager).
          packages: platform-tools

      - name: Make gradlew executable
        if: steps.version.outputs.should_build == 'true'
        run: chmod +x gradlew

      - name: Build release APK
        if: steps.version.outputs.should_build == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        if: steps.version.outputs.should_build == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "garagem-launcher-${{ steps.version.outputs.version_name }}.apk"

      - name: Create GitHub Release
        if: steps.version.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: garagem-launcher-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
