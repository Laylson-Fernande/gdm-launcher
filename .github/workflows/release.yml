name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: Build even if version did not change
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail

          extract_version() {
            local file="$1"
            local name code
            name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$file" | head -1)"
            code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "$file" | head -1)"
            if [ -z "$name" ] || [ -z "$code" ]; then
              echo "::error::Could not read versionName/versionCode from $file"
              exit 1
            fi
            printf '%s %s' "$name" "$code"
          }

          CURRENT="$(extract_version launcher/build.gradle.kts)"
          CURRENT_NAME="${CURRENT%% *}"
          CURRENT_CODE="${CURRENT##* }"
          TAG="v${CURRENT_NAME}"

          {
            echo "version_name=${CURRENT_NAME}"
            echo "version_code=${CURRENT_CODE}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          CHANGED=true
          if [ "${EVENT_NAME}" = "push" ] \
            && [ -n "${BEFORE}" ] \
            && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}:launcher/build.gradle.kts" 2>/dev/null; then
            PREV_FILE="$(mktemp)"
            git show "${BEFORE}:launcher/build.gradle.kts" > "${PREV_FILE}"
            PREVIOUS="$(extract_version "${PREV_FILE}")"
            rm -f "${PREV_FILE}"
            echo "Previous version: ${PREVIOUS}"
            if [ "${PREVIOUS}" = "${CURRENT}" ]; then
              CHANGED=false
            fi
          fi

          echo "Current version: ${CURRENT_NAME} (${CURRENT_CODE})"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

          if [ "${CHANGED}" != "true" ] && [ "${FORCE}" != "true" ]; then
            echo "Version unchanged on main; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          if [ "${STATUS}" = "200" ] && [ "${FORCE}" != "true" ]; then
            echo "Release ${TAG} already exists; skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.version.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.version.outputs.should_build == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Make gradlew executable
        if: steps.version.outputs.should_build == 'true'
        run: chmod +x gradlew

      - name: Write NWD signing key
        if: steps.version.outputs.should_build == 'true'
        env:
          NWD_KEYSTORE_BASE64: ${{ secrets.NWD_KEYSTORE_BASE64 }}
          NWD_KEYSTORE_PASSWORD: ${{ secrets.NWD_KEYSTORE_PASSWORD }}
          NWD_KEY_ALIAS: ${{ secrets.NWD_KEY_ALIAS }}
          NWD_KEY_PASSWORD: ${{ secrets.NWD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NWD_KEYSTORE_BASE64}" ]; then
            echo "::error::Configure os secrets NWD_KEYSTORE_BASE64, NWD_KEYSTORE_PASSWORD, NWD_KEY_ALIAS e NWD_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p keys
          echo "${NWD_KEYSTORE_BASE64}" | base64 --decode > keys/nwd.jks
          printf '%s\n' \
            "storeFile=keys/nwd.jks" \
            "storePassword=${NWD_KEYSTORE_PASSWORD}" \
            "keyAlias=${NWD_KEY_ALIAS}" \
            "keyPassword=${NWD_KEY_PASSWORD}" \
            > keystore.properties

      - name: Build release APKs
        if: steps.version.outputs.should_build == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        if: steps.version.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in */build/outputs/apk/release/*-release.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" dist/
          done
          count="$(find dist -name '*.apk' | wc -l | tr -d ' ')"
          echo "APKs em dist/: ${count}"
          ls -la dist/
          if [ "${count}" -lt 8 ]; then
            echo "::error::Esperava 8 APKs de release, achei ${count}"
            exit 1
          fi
          (
            cd dist
            zip -9 "../updateApk.zip" *.apk
          )

      - name: Require release notes
        if: steps.version.outputs.should_build == 'true'
        run: |
          NOTES="releases/${{ steps.version.outputs.version_name }}.md"
          if [ ! -f "${NOTES}" ]; then
            echo "::error::Missing release notes file: ${NOTES}"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: releases/${{ steps.version.outputs.version_name }}.md
          files: |
            dist/*.apk
            updateApk.zip
          fail_on_unmatched_files: true
